name: Build Sol-ver APK Release

on:
  workflow_dispatch:
  push:

permissions:
  contents: write
  actions: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Platform & Debug Signing for Release
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi
          flutter pub get

      - name: Build Release APK (ARM64)
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solver-Obsidian-Release-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
          if-no-files-found: error
